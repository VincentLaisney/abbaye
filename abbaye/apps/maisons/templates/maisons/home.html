{% extends 'main.html' %}

{% block breadcrumbs %}
    <li class="breadcrumb-item active">Maisons</li>
{% endblock breadcrumbs %}

{% block content %}
    <h1>Calendrier des maisons</h1>

    <iframe src="{{ google_maisons }}" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>

    <div class="d-flex justify-content-center mt-2 mb-5 w-50">
        <div class="col-3 text-center"><span class="fas fa-square me-2" style="color: rgb(246, 191, 38)"></span>Sainte-Marthe</div>
        <div class="col-3 text-center"><span class="fas fa-square me-2" style="color: rgb(213, 0, 0)"></span>Sainte-Reine</div>
        <div class="col-3 text-center"><span class="fas fa-square me-2" style="color: rgb(0, 150, 136)"></span>Sainte-Chantal</div>
        <div class="col-3 text-center"><span class="fas fa-square me-2" style="color: rgb(66, 133, 244)"></span>Sainte-Bernadette</div>
    </div>
{% endblock content %}
